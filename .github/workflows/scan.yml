name: Security scans
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" -w /src zricethezav/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb git /src --no-banner --redact
      - name: Semgrep
        run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:ro" -w /src semgrep/semgrep@sha256:f83a64e8a7d985eaa51ee3978c9c882be946964c68633fba5d2817cf297a3912 semgrep scan --config auto --error .
      - name: OSV-Scanner
        run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:ro" -w /src ghcr.io/google/osv-scanner@sha256:bc10cae80da100d32572aea48cfc48e592be9adc4a8b0820fd5d2c2db71f9446 scan --recursive ./
